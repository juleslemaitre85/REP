name: Variability experiments

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  experiments:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Jinja2 flamapy==2.6.0

      - name: Generate sample
        run: |
          python sample.py fm/experiment.uvl \
            --size 30 \
            --seed 1 \
            --include configs/*.csvconf \
            -o configs/sample.csv

      - name: Run experiments
        run: |
          python scripts/run_experiments.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: results/results.csv
